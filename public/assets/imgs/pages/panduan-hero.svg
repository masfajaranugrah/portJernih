<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="panduanHeroTitle panduanHeroDesc">
  <title id="panduanHeroTitle">Ilustrasi router WiFi JernihNet</title>
  <desc id="panduanHeroDesc">Router WiFi memancarkan sinyal ke perangkat di sekitarnya.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity=".30"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="routerBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <circle cx="300" cy="232" r="228" fill="url(#glow)"/>
  <circle cx="300" cy="232" r="172" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-dasharray="3 11"/>
  <circle cx="300" cy="232" r="122" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- connection lines -->
  <path d="M212 158C248 190 262 232 276 288" fill="none" stroke="url(#accentLine)" stroke-width="2" stroke-dasharray="5 8"/>
  <path d="M392 142C362 190 342 234 326 288" fill="none" stroke="url(#accentLine)" stroke-width="2" stroke-dasharray="5 8"/>
  <path d="M168 352C196 340 224 330 250 324" fill="none" stroke="url(#accentLine)" stroke-width="2" stroke-dasharray="5 8"/>

  <!-- floating card: connected -->
  <g>
    <rect x="52" y="112" width="168" height="66" rx="17" fill="url(#cardFill)" stroke="#ffffff" stroke-opacity=".18"/>
    <circle cx="84" cy="145" r="16" fill="#7dd3fc" fill-opacity=".16" stroke="#7dd3fc" stroke-opacity=".65"/>
    <path d="M77 145l5 5 9-10" fill="none" stroke="#7dd3fc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="110" y="133" width="84" height="9" rx="4.5" fill="#ffffff" fill-opacity=".62"/>
    <rect x="110" y="151" width="54" height="7" rx="3.5" fill="#ffffff" fill-opacity=".26"/>
  </g>

  <!-- floating card: signal -->
  <g>
    <rect x="382" y="96" width="166" height="66" rx="17" fill="url(#cardFill)" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="406" y="126" width="5" height="10" rx="2.5" fill="#7dd3fc" fill-opacity=".55"/>
    <rect x="416" y="121" width="5" height="15" rx="2.5" fill="#7dd3fc" fill-opacity=".7"/>
    <rect x="426" y="116" width="5" height="20" rx="2.5" fill="#7dd3fc" fill-opacity=".85"/>
    <rect x="436" y="110" width="5" height="26" rx="2.5" fill="#7dd3fc"/>
    <rect x="456" y="128" width="70" height="9" rx="4.5" fill="#ffffff" fill-opacity=".62"/>
    <rect x="456" y="146" width="44" height="7" rx="3.5" fill="#ffffff" fill-opacity=".26"/>
  </g>

  <!-- floating badge: shield -->
  <g>
    <rect x="120" y="336" width="112" height="48" rx="24" fill="url(#cardFill)" stroke="#ffffff" stroke-opacity=".18"/>
    <path d="M146 349l10-4 10 4v9c0 7-4.4 12.2-10 14-5.6-1.8-10-7-10-14v-9z" fill="none" stroke="#7dd3fc" stroke-width="2"/>
    <path d="M151 359l4 4 7-8" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="176" y="352" width="38" height="7" rx="3.5" fill="#ffffff" fill-opacity=".5"/>
    <rect x="176" y="365" width="26" height="6" rx="3" fill="#ffffff" fill-opacity=".24"/>
  </g>

  <!-- wifi arcs -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M280 288a28 28 0 0140 0" stroke-width="7" stroke-opacity=".95"/>
    <path d="M264 272a51 51 0 0172 0" stroke-width="6" stroke-opacity=".62"/>
    <path d="M248 256a74 74 0 01104 0" stroke-width="5" stroke-opacity=".34"/>
  </g>

  <!-- wifi dot -->
  <circle cx="300" cy="297" r="5" fill="#7dd3fc"/>

  <!-- antennas -->
  <g stroke="#ffffff" stroke-linecap="round">
    <path d="M224 305l-20-40" stroke-width="6" stroke-opacity=".55"/>
    <path d="M376 305l20-40" stroke-width="6" stroke-opacity=".55"/>
  </g>

  <!-- router body -->
  <g>
    <rect x="205" y="305" width="190" height="78" rx="20" fill="url(#routerBody)" stroke="#ffffff" stroke-opacity=".38"/>
    <rect x="219" y="318" width="162" height="3" rx="1.5" fill="#ffffff" fill-opacity=".16"/>
    <circle cx="262" cy="358" r="4.5" fill="#7dd3fc"/>
    <circle cx="281" cy="358" r="4.5" fill="#ffffff" fill-opacity=".35"/>
    <circle cx="300" cy="358" r="4.5" fill="#ffffff" fill-opacity=".2"/>
    <rect x="330" y="352" width="46" height="12" rx="6" fill="#7dd3fc" fill-opacity=".18" stroke="#7dd3fc" stroke-opacity=".55"/>
  </g>

  <!-- small decorative dots -->
  <circle cx="96" cy="252" r="3" fill="#7dd3fc" fill-opacity=".6"/>
  <circle cx="506" cy="274" r="2.5" fill="#ffffff" fill-opacity=".4"/>
  <circle cx="470" cy="368" r="4" fill="#7dd3fc" fill-opacity=".35"/>
  <circle cx="150" cy="84" r="2.5" fill="#ffffff" fill-opacity=".35"/>
</svg>
